<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彰銓｜生產進度看板（腳輪廠）</title>
<style>
  :root{
    --bg:#eef0ef; --panel:#fff; --ink:#132229; --ink-2:#3d5058; --muted:#6b7c83;
    --line:#d7dedb; --accent:#0f766e; --accent-soft:#e6f2f0;
    --high:#b42318; --high-soft:#fdeceb; --mid:#b45309; --mid-soft:#fdf3e6;
    --low:#15803d; --low-soft:#ecf6ef; --done:#556770; --done-soft:#eef1f2;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}

  .topbar{
    position:sticky; top:0; z-index:30; background:var(--ink); color:#fff;
    display:flex; align-items:center; gap:14px; padding:0 18px; height:52px;
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand b{font-size:15px; letter-spacing:.06em;}
  .brand span{font-size:10px; color:#8fa6ae; letter-spacing:.14em;}
  .live{
    display:inline-flex; align-items:center; gap:6px; font-size:11px;
    color:#9fe3c8; border:1px solid #2f5a4d; background:#132a24;
    padding:3px 8px; border-radius:2px; letter-spacing:.08em;
  }
  .live i{width:6px;height:6px;border-radius:50%;background:#4ade80; display:block; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.25}}
  .tb-right{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:11px;}
  .tb-right .seg{color:#b9c9ce; font-family:var(--mono);}
  .tbtn{
    background:transparent; color:#dce7ea; border:1px solid #38505a;
    border-radius:2px; font-size:11px; padding:5px 10px; cursor:pointer;
  }
  .tbtn:hover{background:#1e343d;}
  .tbtn.on{background:#e8eef0; color:#132229; border-color:#e8eef0;}

  .kpis{
    display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
    background:var(--line); border-bottom:1px solid var(--line);
  }
  .kpi{background:var(--panel); padding:12px 16px 13px;}
  .kpi .k{font-size:10.5px; color:var(--muted); letter-spacing:.08em; font-weight:600;}
  .kpi .v{font-size:24px; font-weight:700; letter-spacing:-.01em; margin-top:3px; font-family:var(--mono); line-height:1.1;}
  .kpi .v small{font-size:11px; font-weight:500; color:var(--muted); margin-left:3px; font-family:inherit;}
  .kpi .s{font-size:10.5px; color:var(--muted); margin-top:3px;}
  .kpi.alert{background:#fffafa;}
  .kpi.alert .v{color:var(--high);}

  .filters{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 18px; background:#f7f9f8; border-bottom:1px solid var(--line);
    position:sticky; top:52px; z-index:20;
  }
  .filters input[type=search], .filters select{
    font:inherit; font-size:12px; height:30px; padding:0 8px;
    border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink);
  }
  .filters input[type=search]{width:250px;}
  .filters input[type=search]:focus, .filters select:focus{outline:none; border-color:var(--accent);}
  .chips{display:flex; gap:6px; margin-left:auto;}
  .chip{
    font:inherit; font-size:11.5px; padding:0 9px; height:26px; border-radius:2px;
    border:1px solid var(--line); background:#fff; color:var(--ink-2); cursor:pointer;
    display:inline-flex; align-items:center; gap:5px;
  }
  .chip .n{font-family:var(--mono); font-size:10.5px; color:var(--muted);}
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .chip.on .n{color:#a9bcc2;}

  .btn{
    font:inherit; font-size:12px; padding:0 12px; height:30px; border-radius:2px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .btn:hover{background:#f4f6f5; border-color:#b9c6c2;}
  .btn.primary{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600;}
  .btn.primary:hover{background:#20363f;}
  .btn.danger{color:var(--high); border-color:#e4b8b3;}
  .btn.ghost{border:none; background:transparent; color:var(--muted); font-size:16px; padding:0 6px;}

  .board{
    display:flex; gap:9px; padding:14px 18px 24px; align-items:flex-start;
    overflow-x:auto; scroll-snap-type:x proximity;
  }
  .col{flex:1 1 190px; min-width:168px; scroll-snap-align:start;}
  .col-head{
    display:flex; align-items:center; gap:6px; padding:0 2px 7px;
    border-bottom:2px solid var(--c); margin-bottom:9px;
  }
  .col-head .dot{width:7px;height:7px;border-radius:50%;background:var(--c);}
  .col-head .nm{font-size:12px; font-weight:700; letter-spacing:.04em;}
  .col-head .tag2{font-size:9px; color:#8a969b; border:1px solid #dbe2df; border-radius:2px; padding:0 3px;}
  .col-head .ct{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted);}
  .col-body{display:flex; flex-direction:column; gap:8px; min-height:40px;}
  .col-empty{font-size:11px; color:#a7b4b9; padding:14px 0; text-align:center;}

  .card{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:2px; padding:9px 10px 8px; cursor:pointer;
    transition:box-shadow .14s, transform .14s, border-color .14s;
  }
  .card:hover{box-shadow:0 4px 14px -6px rgba(19,34,41,.28); transform:translateY(-1px);}
  .card.high{border-left-color:var(--high);}
  .card.mid{border-left-color:var(--mid);}
  .card.low{border-left-color:var(--low);}
  .card.done{border-left-color:#b6c1c6; opacity:.72;}
  .c-top{display:flex; align-items:center; gap:6px;}
  .c-no{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--ink-2);}
  .c-title{font-size:12.5px; font-weight:700; margin:5px 0 2px; line-height:1.35;}
  .c-sub{font-size:10.5px; color:var(--muted); font-family:var(--mono);}
  .c-spec{
    font-size:10.5px; color:var(--ink-2); margin-top:5px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .bar{height:4px; background:#e6ebe9; border-radius:2px; overflow:hidden; margin:7px 0 4px;}
  .bar i{display:block; height:100%; background:var(--accent);}
  .card.high .bar i{background:var(--high);}
  .card.mid .bar i{background:var(--mid);}
  .card.done .bar i{background:#9aa8ad;}
  .c-line{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--muted);}
  .c-pct{margin-left:auto; font-family:var(--mono); font-weight:700; color:var(--ink-2);}
  .c-op{font-size:11px; color:var(--ink); margin-top:5px; font-weight:600;}
  .c-op span{font-weight:400; color:var(--muted); font-family:var(--mono); font-size:10px; margin-left:4px;}
  .c-badge{
    display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.04em;
    padding:1px 5px; border-radius:2px; border:1px solid;
  }
  .b-high{color:var(--high); border-color:#e8b4ae; background:var(--high-soft);}
  .b-mid{color:var(--mid); border-color:#e3c49a; background:var(--mid-soft);}
  .b-low{color:var(--low); border-color:#a8cfb6; background:var(--low-soft);}
  .b-done{color:var(--done); border-color:#c6d0d4; background:var(--done-soft);}
  .b-warn{color:#8a4b00; border-color:#e0c08c; background:#fdf1df; margin-top:6px;}
  .b-side{color:#0369a1; border-color:#a9cbe0; background:#eaf4fb; margin-top:6px;}

  .list-wrap{padding:14px 18px 30px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; background:#fff; font-size:12px;}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.06em; color:var(--muted);
    padding:9px 10px; border-bottom:1px solid var(--line); background:#f7f9f8; font-weight:700; white-space:nowrap;
  }
  tbody td{padding:9px 10px; border-bottom:1px solid #eef1f0; vertical-align:top;}
  tbody tr:hover{background:#fafbfa;}
  .mono{font-family:var(--mono);}

  .scrim{
    position:fixed; inset:0; background:rgba(19,34,41,.35); opacity:0;
    pointer-events:none; transition:opacity .2s; z-index:40;
  }
  .drawer{
    position:fixed; top:0; right:0; height:100dvh; width:min(540px,94vw);
    background:#fff; z-index:50; transform:translateX(100%);
    transition:transform .24s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column;
    box-shadow:-12px 0 40px -18px rgba(0,0,0,.4);
  }
  .d-head{padding:14px 16px; border-bottom:1px solid var(--line); background:var(--ink); color:#fff;}
  .d-body{overflow-y:auto; flex:1; padding:16px;}
  .sec-t{
    font-size:10.5px; letter-spacing:.1em; color:var(--muted); font-weight:700;
    margin:16px 0 7px; padding-bottom:5px; border-bottom:1px solid #edf0ef;
  }
  .sec-t:first-child{margin-top:0;}
  .spec{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; font-size:11.5px;}
  .spec div span{color:var(--muted); font-size:10px; display:block; margin-bottom:1px;}

  .modal{
    position:fixed; inset:0; z-index:70; background:rgba(19,34,41,.42);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal[hidden]{display:none;}
  .modal-card{
    background:#fff; width:min(760px,100%); max-height:92dvh;
    display:flex; flex-direction:column; border-radius:3px; overflow:hidden;
    box-shadow:0 24px 70px -24px rgba(0,0,0,.55);
  }
  .modal-head{padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
  .modal-head h3{margin:0; font-size:14px; letter-spacing:.04em;}
  .modal-body{padding:14px 16px; overflow-y:auto;}
  .modal-foot{padding:10px 16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; background:#fafbfa;}
  .form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px 12px;}
  .fld{display:flex; flex-direction:column; gap:3px;}
  .fld label{font-size:10.5px; color:var(--muted); letter-spacing:.04em;}
  .fld input, .fld select{
    font:inherit; font-size:12px; height:32px; padding:0 8px;
    border:1px solid var(--line); border-radius:2px; background:#fff; color:var(--ink);
  }
  .fld input:focus, .fld select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);}
  .fld input.err{border-color:var(--high); background:#fff8f7;}
  .span2{grid-column:span 2;}
  .span3{grid-column:span 3;}
  .checks{display:flex; gap:7px; flex-wrap:wrap;}
  .trow{
    display:flex; align-items:center; gap:6px; height:32px; padding:0 8px;
    border:1px solid var(--line); border-radius:2px; background:#fff;
  }
  .trow:has(input:checked){border-color:var(--accent); background:var(--accent-soft);}
  .trow label{display:inline-flex; align-items:center; gap:5px; font-size:12px; cursor:pointer; color:var(--ink);}
  .trow input[type=checkbox]{width:14px; height:14px; accent-color:var(--accent); margin:0;}
  .trow .tq{
    width:66px; height:24px; font:inherit; font-size:11.5px; font-family:var(--mono);
    border:1px solid var(--line); border-radius:2px; padding:0 5px; background:#fff;
  }
  .trow .tq:disabled{background:#f4f6f5; color:#a7b4b9;}
  .switch{display:flex; align-items:center; gap:7px; height:32px; font-size:12px;}
  .switch input{width:15px; height:15px; accent-color:var(--accent);}
  .hint{grid-column:1/-1; font-size:10.5px; color:var(--muted); margin-top:-2px; line-height:1.5;}
  .err-msg{grid-column:1/-1; font-size:11.5px; color:var(--high); background:var(--high-soft);
    border:1px solid #f0c8c4; border-radius:2px; padding:6px 9px;}

  .seg{display:inline-flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:#fff;}
  .seg button{
    font:inherit; font-size:10.5px; padding:4px 7px; border:0; border-right:1px solid var(--line);
    background:#fff; color:var(--muted); cursor:pointer; white-space:nowrap;
  }
  .seg button:last-child{border-right:0;}
  .seg button:hover{background:#f5f8f7;}
  .seg button.on[data-s="wait"]{background:#eef1f2; color:#46596a; font-weight:700;}
  .seg button.on[data-s="run"]{background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .seg button.on[data-s="done"]{background:var(--low-soft); color:var(--low); font-weight:700;}
  .seg.locked{opacity:.5;}
  .seg.locked button{cursor:not-allowed;}
  .seg button.on[data-s="open"]{background:var(--mid-soft); color:var(--mid); font-weight:700;}
  .seg button.on[data-s="closed"]{background:#eef1f2; color:#46596a; font-weight:700;}

  .issue{border-left:2px solid var(--mid); padding:2px 0 2px 9px; margin-bottom:10px; font-size:11.5px;}
  .issue.is-closed{border-left-color:var(--line);}
  .issue.is-closed .is-desc{color:var(--muted);}
  .issue-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .issue-h b{font-weight:700;}
  .xbtn{border:0; background:none; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 2px;}
  .xbtn:hover{color:var(--high);}
  .if-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  #issueForm{
    border:1px solid var(--line); border-radius:3px; padding:10px; margin:8px 0 12px; background:#fafbfa;
  }
  #issueForm[hidden]{display:none;}
  #issueForm label{font-size:10px;}
  #issueForm input, #issueForm select{
    font:inherit; font-size:11.5px; height:28px; padding:0 6px;
    border:1px solid var(--line); border-radius:3px; background:#fff; width:100%;
  }
  #issueForm input.err{border-color:var(--high); background:#fff7f6;}
  .status{
    display:inline-block; font-size:9px; font-weight:700; letter-spacing:.03em;
    padding:1px 4px; border:1px solid; border-radius:2px; white-space:nowrap;
  }
  .s-done{color:#15803d; border-color:#9dd0ae; background:#ecf6ef;}
  .s-run{color:#0f766e; border-color:#9fcac4; background:#e6f2f0;}
  .s-wait{color:#6b7c83; border-color:#cfd8d5; background:#f4f6f5;}
  .board[hidden]{display:none;}

  .rec-head{
    display:flex; align-items:flex-end; gap:12px; padding:14px 16px 12px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .rec-title{font-size:14px; font-weight:700; letter-spacing:.03em;}
  .rec-title #recCount{font-family:var(--mono); font-size:12px; color:var(--muted); font-weight:400; margin-left:4px;}
  .rec-note{display:block; font-size:10.5px; color:var(--muted); font-weight:400; margin-top:3px; letter-spacing:0;}
  .rec-actions{margin-left:auto; display:flex; gap:8px;}
  #recTable .on-board{font-size:9px; color:var(--accent); border:1px solid #9fcac4; background:var(--accent-soft);
    padding:0 4px; border-radius:2px; margin-left:6px; vertical-align:1px;}
  .col-more{
    width:100%; margin-top:2px; padding:8px 6px; font:inherit; font-size:10.5px;
    border:0; border-top:1px dashed var(--line); background:none; color:var(--accent);
    cursor:pointer; text-align:center; letter-spacing:.02em;
  }
  .col-more:hover{background:var(--accent-soft);}

  #toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%,10px);
    background:#132229; color:#fff; font-size:12px; padding:9px 16px; border-radius:2px;
    opacity:0; pointer-events:none; transition:.22s; z-index:90;
  }
  #toast.on{opacity:1; transform:translate(-50%,0);}

  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr);}
    .kpi:nth-child(5){grid-column:span 2;}
    .col{flex:0 0 82vw; min-width:0;}
    .filters{position:static;}
    .filters input[type=search]{flex:1 1 100%; width:100%;}
    .chips{margin-left:0; flex-wrap:wrap;}
    .form-grid{grid-template-columns:1fr 1fr;}
    .span2,.span3{grid-column:span 2;}
    .modal{padding:0;}
    .modal-card{max-height:100dvh; height:100dvh; border-radius:0;}
    #btnAdd{flex:1 1 100%;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><b>彰銓 · 生產進度看板</b><span>CASTER WORKFLOW</span></div>
  <span class="live"><i></i><span id="liveTxt">即時</span></span>
  <div class="tb-right">
    <span class="seg" id="updated">—</span>
    <span class="seg" id="countdown">—</span>
    <button class="tbtn" id="btnRefresh">更新</button>
    <button class="tbtn on" id="btnBoard">看板</button>
    <button class="tbtn" id="btnList">清單</button>
    <button class="tbtn" id="btnRec">訂單紀錄</button>
  </div>
</header>

<section class="kpis">
  <div class="kpi">
    <div class="k">在製派工單</div>
    <div class="v" id="kpiWip">0</div>
    <div class="s" id="kpiWipSub">—</div>
  </div>
  <div class="kpi">
    <div class="k">7 日內到期</div>
    <div class="v" id="kpiDue">0</div>
    <div class="s">含今天，未結案</div>
  </div>
  <div class="kpi alert">
    <div class="k">逾期／將逾期</div>
    <div class="v" id="kpiLate">0</div>
    <div class="s" id="kpiLateSub">—</div>
  </div>
  <div class="kpi">
    <div class="k">平均完成率</div>
    <div class="v" id="kpiAvg">0<small>%</small></div>
    <div class="s">依工時加權</div>
  </div>
  <div class="kpi">
    <div class="k">準時達交率</div>
    <div class="v" id="kpiOtd">0<small>%</small></div>
    <div class="s" id="kpiOtdSub">—</div>
  </div>
</section>

<div class="filters">
  <input type="search" id="fQ" placeholder="搜尋 單號／代碼／訂單／腳架">
  <select id="fCust"><option value="">全部客戶</option></select>
  <select id="fOwner"><option value="">全部負責人</option></select>
  <div class="chips" id="chips">
    <button class="chip on" data-risk="">全部 <span class="n" id="cAll">0</span></button>
    <button class="chip" data-risk="high">高風險 <span class="n" id="cHigh">0</span></button>
    <button class="chip" data-risk="mid">注意 <span class="n" id="cMid">0</span></button>
    <button class="chip" data-risk="low">正常 <span class="n" id="cLow">0</span></button>
  </div>
  <button class="btn primary" id="btnAdd">＋ 新增派工單</button>
  <button class="btn" id="btnReset" title="清除本機資料，回到示範資料">重置</button>
</div>

<main>
  <div class="board" id="board"></div>
  <div class="list-wrap" id="listView" hidden>
    <table id="listTable">
      <thead>
        <tr>
          <th>派工單</th><th>客戶代碼</th><th>品名</th><th>數量</th>
          <th>當前流程</th><th>完成</th><th>預交</th><th>風險</th><th>負責人</th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>

  <div class="list-wrap" id="recView" hidden>
    <div class="rec-head">
      <div class="rec-title">訂單紀錄 <span id="recCount">—</span>
        <span class="rec-note">看板只留最近 5 張結案，其餘集中在這裡</span></div>
      <div class="rec-actions">
        <button class="btn" id="btnCsv">匯出 CSV</button>
        <button class="btn primary" id="btnSync">同步到 Google Sheets</button>
      </div>
    </div>
    <table id="recTable">
      <thead>
        <tr>
          <th>結案日</th><th>派工單</th><th>客戶代碼</th><th>品名</th>
          <th>型式 · 數量</th><th>預交</th><th>交期結果</th><th>工序</th>
        </tr>
      </thead>
      <tbody id="recBody"></tbody>
    </table>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="d-head" id="dHead"></div>
  <div class="d-body" id="drawerBody"></div>
</aside>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3>新增派工單</h3>
      <span style="font-size:10.5px;color:var(--muted);">建立後直接在看板跟進</span>
      <button class="btn ghost" id="btnCloseModal" style="margin-left:auto;">×</button>
    </div>

const dayNum = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d)/864e5; };
const todayNum = () => { const d = now(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/864e5; };
const isoNum = n => new Date(n*864e5).toISOString().slice(0,10);
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtTime = t => { const d = new Date(t); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; };

function normalizeOrder(r){
  // 舊資料有 MM-DD 格式，統一補成 YYYY-MM-DD
  const yr = (r.created && r.created.length === 10) ? Number(r.created.slice(0,4)) : 2026;
  const fd = s => (typeof s === 'string' && /^\d{2}-\d{2}$/.test(s)) ? `${yr}-${s}` : s;

  return {
    ...r,
    created: fd(r.created), due: fd(r.due), forecast: fd(r.forecast),
    custom: !!r.custom,
    ops: (r.ops||[]).map(o => Array.isArray(o)
      ? { name:o[0], stage:o[1], hours:o[2], pct:o[3], planS:fd(o[4]), planE:fd(o[5]),
          actS:fd(o[6]), actE:fd(o[7]), owner:o[8]||'', note:o[9]||'', lane:o[10]==='side'?'side':'main' }

          planS:fd(o.planS), planE:fd(o.planE), actS:fd(o.actS), actE:fd(o.actE) }),

  return list.map(([no,order,code,wheel,material,color,types,typeQty,cartons,created,due,closed,owner])=>{

      return [name, stage, hours, 100, isoNum(ps), isoNum(pe), isoNum(ps), isoNum(last ? c0 : pe), owner, ''];
    });
    ops.push(['採購（輪子）','purchase',16,100,isoNum(s0),isoNum(s0+6),isoNum(s0),isoNum(s0+5),'採購','','side']);

    const qty = Object.values(typeQty).reduce((a,b)=>a+b,0);

    return {

/* ---------------- 推導 ---------------- */
function derive(o){
  const ops = o.ops;
  const total = ops.reduce((s,x)=>s+x.hours,0) || 1;
  const doneH = ops.reduce((s,x)=>s + x.hours*(x.pct/100), 0);
  const pct = Math.round(doneH/total*100);

  const mainOps = ops.filter(x=>x.lane !== 'side');
  const cur = mainOps.find(x=>x.pct < 100);

  const sideOps = ops.filter(x=>x.lane === 'side');
  const wheelsOk = sideOps.every(x=>x.pct >= 100);

  const idxOf = k => STAGES.findIndex(s=>s.key === k);
  const asmIdx = idxOf('assemble');
  // 成品組裝與採購（輪子）都完成，才放行檢驗
  const asmComplete = mainOps.every(o => idxOf(o.stage) > asmIdx || o.pct >= 100);
  const blocked = !wheelsOk && asmComplete;

  let stage = cur ? cur.stage : 'closed';
  const naturalStage = stage;                // 未考慮閘門時應該到的位置
  if(blocked) stage = 'assemble';            // 卡在成品組裝，不放行檢驗

  // 未結案異常 → 卡住該工序所屬階段，不得往下走
  let holdStage = null;
  (o.issues || []).filter(i=>i.status !== '已結案').forEach(it=>{
    const op = o.ops.find(x=>x.name === it.op);
    const st = op ? op.stage : (cur ? cur.stage : null);
    if(!st || st === 'closed') return;
    if(holdStage === null || idxOf(st) < idxOf(holdStage)) holdStage = st;
  });
  const issueHold = holdStage !== null && idxOf(naturalStage) > idxOf(holdStage);
  if(issueHold) stage = holdStage;

  const curOp = issueHold ? '異常未結案'
              : blocked  ? '等待輪子到料'
              : (cur ? cur.name : '已結案');

  const dueIn = dayNum(o.due) - todayNum();
  const fcIn = dayNum(o.forecast || o.due) - todayNum();
  const openIssue = (o.issues||[]).some(i=>i.status !== '已結案');

  let risk;
  if(stage === 'closed')       risk = 'done';
  else if(dueIn < 0)           risk = 'high';
  else if(dayNum(o.forecast || o.due) > dayNum(o.due)) risk = 'high';
  else if(blocked)             risk = 'mid';
  else if(openIssue)           risk = 'mid';
  else if(dueIn <= 3)          risk = 'mid';
  else                         risk = 'low';

  if(blocked && risk === 'low') risk = 'mid';

  // 結案時間：最後一道工序的實際完成日（無資料則取最後更新）
  const acts = ops.map(x=>x.actE).filter(Boolean).sort();
  const closedAt = stage === 'closed' ? (acts.length ? acts[acts.length-1] : isoDate(o.updated || now())) : '';

  return {...o, pct, stage, curOp, closedAt, dueIn, fcIn, wheelsOk, blocked, issueHold, risk, openIssue};
}

let rows = orders.map(derive);

const CLOSED_LIMIT = 5;          // 看板「已結案」欄最多顯示張數
const RISK_TXT = { high:'高風險', mid:'注意', low:'正常', done:'已結案' };
const RISK_CLS = { high:'b-high', mid:'b-mid', low:'b-low', done:'b-done' };

function dueText(r){
  if(r.stage === 'closed') return '已結案';
  if(r.dueIn < 0) return `逾期 ${-r.dueIn} 天`;
  if(r.dueIn === 0) return '今天到期';
  return `剩 ${r.dueIn} 天`;
}

function visible(){
  const q = state.q.trim().toLowerCase();
  return rows.filter(r=>{
    if(state.cust && (r.customer||'') !== state.cust) return false;
    if(state.owner && r.owner !== state.owner) return false;
    if(state.risk){
      if(state.risk === 'high' && r.risk !== 'high') return false;
      if(state.risk === 'mid'  && r.risk !== 'mid')  return false;
      if(state.risk === 'low'  && r.risk !== 'low')  return false;
    }
    if(!q) return true;
    const hay = [r.no, r.order, r.code, r.fork, r.wheel, r.material, productName(r), r.customer]
      .join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function renderKPI(){
  const active = rows.filter(r=>r.stage !== 'closed');
  const due7 = active.filter(r=>r.dueIn >= 0 && r.dueIn <= 7).length;
  const high = rows.filter(r=>r.risk === 'high');
  const overdue = high.filter(r=>r.dueIn < 0).length;
  const soon = high.length - overdue;
  const avg = active.length ? Math.round(active.reduce((s,r)=>s+r.pct,0)/active.length) : 0;
  // 準時達交率：以已結案紀錄實算（沒有紀錄時才用示範值）
  const closedRows = rows.filter(r=>r.stage === 'closed' && r.closedAt);
  const onTimeN = closedRows.filter(r=>dayNum(r.closedAt) <= dayNum(r.due)).length;
  const otdBase = closedRows.length ? { onTime: onTimeN, total: closedRows.length } : HISTORY;
  const otd = otdBase.total ? Math.round(otdBase.onTime/otdBase.total*100) : 0;

  const g = id => document.getElementById(id);
  g('kpiWip').textContent = active.length;
  g('kpiWipSub').textContent = active.length
    ? `${active.filter(r=>r.blocked).length} 張等輪子 · ${active.reduce((s,r)=>s+r.qty,0).toLocaleString()} 只`
    : '目前無在製';
  g('kpiDue').textContent = due7;
  g('kpiLate').textContent = high.length;
  g('kpiLateSub').textContent = `逾期 ${overdue} · 將逾期 ${soon}`;
  g('kpiAvg').innerHTML = `${avg}<small>%</small>`;
  g('kpiOtd').innerHTML = `${otd}<small>%</small>`;
  g('kpiOtdSub').textContent = `${otdBase.onTime}/${otdBase.total} 準時 · ${closedRows.length ? '已結案' : '近 30 日'}`;

  g('cAll').textContent = rows.length;
  g('cHigh').textContent = high.length;
  g('cMid').textContent = rows.filter(r=>r.risk === 'mid').length;
  g('cLow').textContent = rows.filter(r=>r.risk === 'low').length;
}

const csvCell = v => {
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
};

function recordsCsv(){
  const head = ['結案日','派工單','訂單號','客戶代碼','品名','型式','數量','單位','箱數',
                '預交','交期結果','腳架','電鍍顏色','螺絲','上皿','下皿','輪子','材質','顏色','包裝方式','負責人'];
  const lines = [head.join(',')];

  recRows().forEach(r=>{
    const d = dayNum(r.closedAt) - dayNum(r.due);
    lines.push([
      r.closedAt, r.no, r.order, r.code, productName(r), (r.types || []).join('+'),
      r.qty, r.unit, r.cartons || '', r.due,
      d <= 0 ? '準時' : `逾期 ${d} 天`,
      r.fork, r.plating, r.screw, r.up, r.down, r.wheel, r.material, r.color, r.pack, r.owner
    ].map(csvCell).join(','));
  });

  return '\uFEFF' + lines.join('\r\n');
}

function downloadCsv(){
  const blob = new Blob([recordsCsv()], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `訂單紀錄_${isoDate(now())}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

async function syncRecords(){
  const list = recRows();
  if(!list.length){ toast('目前沒有結案紀錄可同步'); return; }

  if(!CFG.recordEndpoint){
    downloadCsv();
    toast('尚未接 Google Sheets：已匯出 CSV，可直接貼上試算表');
    return;
  }

  try{
    const res = await fetch(CFG.recordEndpoint, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // 避開 CORS preflight
      body: JSON.stringify({ action:'archive', csv: recordsCsv() })
    });
    const j = await res.json();
    toast(`已同步 ${j.count ?? list.length} 筆到「訂單紀錄」`);
  }catch(err){
    downloadCsv();
    toast('同步失敗，已改為匯出 CSV');
  }
}

/* ---------------- 更新進度 ---------------- */
function setStatus(no, idx, s){
  const o = orders.find(x=>x.no === no);
  if(!o || !o.ops[idx]) return;
  const op = o.ops[idx];

  // 閘門：採購（輪子）未完成，檢驗不得開始
  if(s !== 'wait' && op.stage === 'inspect'){
    const wheels = o.ops.filter(x=>x.lane === 'side');
    if(wheels.some(x=>x.pct < 100)){
      toast('輪子採購尚未完成，先完成採購才能進檢驗');
      return;
    }
  }

  if(s === 'done')      op.pct = 100;
  else if(s === 'wait') op.pct = 0;
  else                  op.pct = (op.pct > 0 && op.pct < 100) ? op.pct : 50;  // 進行中：保留原進度，首次給 50

  if(op.pct > 0 && !op.actS) op.actS = isoDate(now());
  if(op.pct >= 100) op.actE = op.actE || isoDate(now());
  else op.actE = '';

  o.updated = now();
  lastUpdated = now();
  saveOrders();

  rows = orders.map(derive);
  renderKPI(); renderBoard(); renderList();
  document.getElementById('updated').textContent = `更新 ${fmtTime(lastUpdated)}`;

  // 就地更新抽屜，不重繪整份（保留捲動位置）
  const seg = document.querySelector(`#drawerBody .seg[data-i="${idx}"]`);
  if(seg) seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s === s));
  const bar = document.querySelector(`#drawerBody [data-bar="${idx}"]`);
  if(bar) bar.style.width = op.pct + '%';
  const nr = rows.find(x=>x.no === no);
  if(nr){
    document.getElementById('dPct').textContent = nr.pct + '%';
    document.getElementById('dStage').textContent = nr.stage === 'closed' ? '已結案' : stageName(nr.stage);
  }

  const hasOpen = (o.issues || []).some(i=>i.status !== '已結案' && i.op === op.name);
  if(s === 'done' && hasOpen) toast('已標記完成；異常未結案，流程暫停');
}

function allocate(list, startNum, endNum){
  const s0 = startNum, e0 = Math.max(endNum, startNum);
  const span = e0 - s0 + 1;
  const totalH = list.reduce((s,t)=>s+t[2],0) || 1;
  const dur = list.map(t=>Math.max(1, Math.round(t[2]/totalH*span)));
  let diff = dur.reduce((a,b)=>a+b,0) - span;
  while(diff > 0 && dur.some(v=>v>1)){
    const i = dur.indexOf(Math.max(...dur)); dur[i]--; diff--;
  }
  while(diff < 0){
    const i = dur.indexOf(Math.max(...dur)); dur[i]++; diff++;
  }
  let cursor = s0;
  return list.map((t,i)=>{
    const s = Math.min(cursor, e0);
    const e = Math.min(s + dur[i] - 1, e0);
    cursor = e + 1;
    return { name:t[0], stage:t[1], hours:t[2], lane:'main',
             pct:0, planS:isoNum(s), planE:isoNum(e), actS:'', actE:'', owner:'', note:'' };
  });
}

    if(bad && $(bad) && $(bad).focus) $(bad).focus();
    return;
  }
  $('formErr').hidden = true;

  const types = typeRows.map(t=>t.name);
  const typeQty = Object.fromEntries(typeRows.map(t=>[t.name, t.qty]));
  const sumQty = typeRows.reduce((s,t)=>s+t.qty, 0);

  const no = g('fNo');
  if(orders.some(o=>o.no === no)){
    $('fNo').classList.add('err');
    const el = $('formErr');
    el.textContent = `派工單號 ${no} 已存在`;
    el.hidden = false;
    return;
  }

  const created = g('fDate'), due = g('fDue');
  const forecast = g('fForecast') || due;
  const s0 = dayNum(created), e0 = dayNum(forecast);
  const special = $('fSpecial').checked;

  const list = special
    ? [BASE_OPS[0], BASE_OPS[1], SPECIAL_OP, ...BASE_OPS.slice(2)]
    : BASE_OPS.slice();
  const mainOps = allocate(list, s0, e0);
  const sideOps = allocate([SIDE_OP], s0, Math.max(s0, s0 + Math.round((e0 - s0) * 0.6)));
  sideOps[0].lane = 'side';

  const o = normalizeOrder({
    no, order: g('fOrder'), code: g('fCode'), name: g('fName'),
    fork: g('fFork'), plating: $('fPlating').value, screw: g('fScrew'),
    up: g('fUp'), down: g('fDown'), wheel: g('fWheel'),
    material: $('fMat').value, color: g('fColor'),
    types, typeQty, qty: sumQty || Number(g('fQty')) || 0,
    cartons: Number(g('fCartons')) || 0, unit: $('fUnit').value,
    packing: g('fPack'), customer: g('fCust2'),
    owner: g('fOwner2'), created, due, forecast,
    custom: true,
    ops: [...mainOps, ...sideOps],
    issues: [], materials: [],
    logs: [{ date: isoDate(now()), by: g('fOwner2'),
             summary: `建立派工單${special ? '（含特殊加工）' : ''}`,
             todo: '確認材料與輪子到料日' }],
    updated: now()
  });

  orders.unshift(o);
  saveOrders();
  lastUpdated = now();
  rows = orders.map(derive);
  state.risk = ''; state.q = ''; state.cust = ''; state.owner = '';
  $('fQ').value = ''; $('fCust').value = ''; $('fOwner').value = '';
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on', c.dataset.risk === ''));
  renderAll();
  closeModal();
  toast(`已建立 #${no}`);
  setTimeout(()=>openDrawer(no), 120);
}

/* ---------------- 篩選與事件 ---------------- */
document.getElementById('fQ').addEventListener('input', e=>{ state.q = e.target.value; renderBoard(); renderList(); });
document.getElementById('fCust').addEventListener('change', e=>{ state.cust = e.target.value; renderBoard(); renderList(); });
document.getElementById('fOwner').addEventListener('change', e=>{ state.owner = e.target.value; renderBoard(); renderList(); });
document.querySelectorAll('#chips .chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    state.risk = c.dataset.risk;
    document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on', x === c));
    renderBoard(); renderList();
  });
});
function setView(v){
  state.view = v;
  document.getElementById('board').hidden = v !== 'board';
  document.getElementById('listView').hidden = v !== 'list';
  document.getElementById('recView').hidden = v !== 'rec';
  document.getElementById('btnBoard').classList.toggle('on', v === 'board');
  document.getElementById('btnList').classList.toggle('on', v === 'list');
  document.getElementById('btnRec').classList.toggle('on', v === 'rec');
  if(v === 'rec') renderRec();
}
document.getElementById('btnBoard').onclick = ()=>setView('board');
document.getElementById('btnList').onclick = ()=>setView('list');
document.getElementById('btnRec').onclick = ()=>setView('rec');
document.getElementById('btnCsv').onclick = downloadCsv;
document.getElementById('btnSync').onclick = syncRecords;
document.getElementById('btnAdd').onclick = openModal;
document.getElementById('btnCloseModal').onclick = closeModal;
document.getElementById('btnCancel').onclick = closeModal;
document.getElementById('btnCreate').onclick = createOrder;
document.getElementById('scrim').onclick = closeDrawer;
document.getElementById('btnReset').onclick = ()=>{
  if(!confirm('清除本機新增與修改，回到示範資料？')) return;
  localStorage.removeItem(STORE_KEY);
  orders = seedOrders(); orders.forEach(normalizeQty);
  saveOrders(); rows = orders.map(derive);
  state.risk = ''; state.q = ''; state.cust = ''; state.owner = '';
  document.getElementById('fQ').value = '';
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on', c.dataset.risk === ''));
  renderAll(); toast('已重置為示範資料');
};
modal.addEventListener('click', e=>{ if(e.target === modal) closeModal(); });

/* 型式勾選 → 啟用數量欄，總數自動帶回「數量」 */
function syncQty(){
  const sum = [...document.querySelectorAll('#fTypes .trow')]
    .filter(r=>r.querySelector('input[type=checkbox]').checked)
    .reduce((s,r)=>s + (Number(r.querySelector('.tq').value) || 0), 0);
  if(sum > 0) $('fQty').value = sum;
}
document.getElementById('fTypes').addEventListener('change', e=>{
  if(e.target.matches('input[type=checkbox]')){
    const row = e.target.closest('.trow');
    const q = row.querySelector('.tq');
    q.disabled = !e.target.checked;
    if(e.target.checked){ q.focus(); }
    else { q.value = ''; }
  }
  syncQty();
});
document.getElementById('fTypes').addEventListener('input', e=>{
  if(e.target.matches('.tq')) syncQty();
});

document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  closeDrawer();
  if(!modal.hidden) closeModal();
});

/* ---------------- 輪詢 ---------------- */
let pollLeft = 30;
function refresh(){
  lastUpdated = now();
  rows = orders.map(derive);
  renderAll();
  pollLeft = 30;
}
document.getElementById('btnRefresh').onclick = ()=>{ refresh(); toast('已更新'); };
setInterval(()=>{
  pollLeft--;
  if(pollLeft <= 0){ refresh(); return; }
  document.getElementById('countdown').textContent = `${pollLeft}s`;
}, 1000);

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('on'), 2200);
}

/* boot */
setView('board');
renderAll();
document.getElementById('countdown').textContent = `${pollLeft}s`;
</script>
</body>
</html>
